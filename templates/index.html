<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart QR Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }

    form {
      background: #1e293b;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 400px;
      transition: transform 0.2s ease-in-out;
    }

    form:hover {
      transform: scale(1.02);
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 0.8rem;
      margin: 0.8rem 0;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    input[type="text"] {
      background: #334155;
      color: #e2e8f0;
    }

    input[type="file"] {
      background: #334155;
      color: #94a3b8;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 100%;
    }

    button:hover {
      background: #0ea5e9;
    }

    .qr-section {
      margin-top: 2rem;
    }

    .qr-section img {
      width: 200px;
      height: 200px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>🔗 Smart QR Code Generator</h1>

  <form action="/generate_qr" method="POST" enctype="multipart/form-data">
    <label for="text">Enter URL or Text:</label>
    <input type="text" id="text" name="text" placeholder="Paste your link or text">

    <label for="file">Or Upload a File:</label>
    <input type="file" id="file" name="file">

    <button type="submit">Generate QR</button>
  </form>

  {% if qr_code %}
  <div class="qr-section">
    <h3>Generated QR Code:</h3>
    <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
  </div>
  {% endif %}

  <footer>Created with 💙 Flask & Python</footer>
</body>
</html>
